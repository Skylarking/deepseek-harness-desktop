<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Plugins</title>
    <link rel="stylesheet" href="./plugins.css" />
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1 id="page-title">Plugins</h1>
        <p id="summary">Loading profile...</p>
      </div>
      <div class="toolbar-actions">
        <button id="open-profile" class="icon-button" title="Open profile folder" aria-label="Open profile folder"><i data-lucide="folder-open"></i></button>
        <button id="restart" class="icon-button" title="Restart DSH" aria-label="Restart DSH"><i data-lucide="rotate-ccw"></i></button>
        <button id="install" class="primary"><i data-lucide="plus"></i><span>Install Local</span></button>
      </div>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite"></div>
      <section class="plugin-group" aria-labelledby="installed-heading">
        <h2 id="installed-heading">Plugins</h2>
        <div id="plugins"></div>
      </section>
      <section id="skills-group" class="plugin-group" aria-labelledby="skills-heading" hidden>
        <h2 id="skills-heading">Skill packages</h2>
        <div id="skills"></div>
      </section>
      <section id="packages-group" class="plugin-group" aria-labelledby="packages-heading" hidden>
        <h2 id="packages-heading">Other packages</h2>
        <div id="packages"></div>
      </section>
      <div id="empty" hidden>
        <i data-lucide="puzzle"></i>
        <h2 id="empty-title">No custom plugins installed</h2>
        <p id="empty-description">Install a local package to add it to the Web profile.</p>
      </div>
    </main>
    <script type="module" src="./plugins.ts"></script>
  </body>
</html>
